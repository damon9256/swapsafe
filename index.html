<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>SwapSafe P2P</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
/* ... (Existing CSS remains here for UI consistency) ... */
:root {
  --bg: #0D0D0D; --surface: #1A1A1A; --border: #2A2A2A; --white: #F5F5F0;
  --green: #4ADE80; --red: #F87171; --r: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cabinet Grotesk', sans-serif; background: var(--bg); color: var(--white); max-width: 430px; margin: 0 auto; height: 100vh; overflow: hidden; }
.screen { display: none; height: 100vh; flex-direction: column; padding-bottom: 80px; overflow-y: auto; }
.screen.active { display: flex; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin: 10px; }
.bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; display: grid; grid-template-columns: repeat(4, 1fr); background: #111; border-top: 1px solid var(--border); padding: 15px 0; z-index: 100; }
.nav-item { text-align: center; font-size: 10px; color: #444; cursor: pointer; }
.nav-item.active { color: var(--white); }
</style>
</head>
<body>

<section id="screen-home" class="screen active">
    <div style="padding: 20px;">
        <h1 style="font-family: 'Clash Display'; font-size: 24px;">SwapSafe</h1>
        <div class="card" style="background: linear-gradient(135deg, #1a1a1a, #111);">
            <div style="font-size: 12px; color: #888; margin-bottom: 5px;">TOTAL BALANCE</div>
            <div id="main-balance" style="font-size: 36px; font-weight: 800;">$0.00</div>
            <div id="inr-equiv" style="color: #444; font-size: 14px;">≈ ₹0.00</div>
        </div>
    </div>
</section>

<section id="screen-p2p" class="screen">
    <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-family: 'Clash Display';">P2P Market</h2>
        <button onclick="switchScreen('screen-post')" style="background: #fff; border: none; padding: 5px 15px; border-radius: 20px; font-weight: 700;">+ Post</button>
    </div>
    <div style="display: flex; gap: 10px; padding: 0 15px 15px;">
        <div class="filter-chip active" onclick="loadAds('buy')">Buy</div>
        <div class="filter-chip" onclick="loadAds('sell')">Sell</div>
    </div>
    <div id="ad-list-container"></div>
</section>

<section id="screen-post" class="screen">
    <div style="padding: 20px;">
        <h2>Post Advertisement</h2>
        <div class="card">
            <label style="display:block; font-size: 11px; margin-bottom: 5px;">PRICE (INR)</label>
            <input type="number" id="post-price" placeholder="e.g. 91.50" style="width:100%; background:#000; border:1px solid #333; color:#fff; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
            
            <label style="display:block; font-size: 11px; margin-bottom: 5px;">AMOUNT (USDT)</label>
            <input type="number" id="post-amount" placeholder="Min 10" style="width:100%; background:#000; border:1px solid #333; color:#fff; padding: 12px; border-radius: 8px; margin-bottom: 20px;">
            
            <button onclick="submitNewAd()" id="post-btn" style="width: 100%; background: #fff; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer;">PUBLISH AD</button>
        </div>
    </div>
</section>

<div class="bottom-nav">
    <div class="nav-item active" onclick="switchScreen('screen-home')">HOME</div>
    <div class="nav-item" onclick="switchScreen('screen-p2p')">P2P</div>
    <div class="nav-item" onclick="switchScreen('screen-post')">POST</div>
    <div class="nav-item">PROFILE</div>
</div>

<script>
// ============ SUPABASE CONFIG ============
const SUPABASE_URL = 'https://pnqxubvndqfbmndrkzfp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBucXh1YnZuZHFmYm1uZHJremZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3OTkwNDEsImV4cCI6MjA5MjM3NTA0MX0.zDIMmFs4xaoh1pgrUr0wbo5_5f9WMdhntN7wBi7PFPQ';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============ TG APP INIT ============
const tg = window.Telegram.WebApp;
const userData = tg.initDataUnsafe?.user || { id: 77777, username: 'Guest' };

async function initApp() {
    tg.expand();
    await syncUser();
    loadAds('buy');
}

// 1. New User Logic (Balance = 0)
async function syncUser() {
    let { data: profile } = await _supabase
        .from('profiles')
        .select('*')
        .eq('id', userData.id)
        .single();

    if (!profile) {
        const { data } = await _supabase.from('profiles').insert([
            { id: userData.id, username: userData.username, balance: 0.00, rating: 100 }
        ]).select().single();
        profile = data;
    }

    document.getElementById('main-balance').innerText = `$${profile.balance.toFixed(2)}`;
    document.getElementById('inr-equiv').innerText = `≈ ₹${(profile.balance * 91).toLocaleString()}`;
}

// 2. Escrow Logic: Post Advertisement
async function submitNewAd() {
    const price = document.getElementById('post-price').value;
    const amount = document.getElementById('post-amount').value;
    const btn = document.getElementById('post-btn');

    if(!price || !amount) return tg.showAlert("Please enter details");

    btn.disabled = true; btn.innerText = "Processing...";

    const { error } = await _supabase.from('ads').insert([{
        user_id: userData.id,
        type: 'buy',
        price: parseFloat(price),
        amount: parseFloat(amount),
        status: 'active'
    }]);

    if(!error) {
        tg.showAlert("Advertisement Published!");
        switchScreen('screen-p2p');
        loadAds('buy');
    } else {
        tg.showAlert("Error: " + error.message);
    }
    btn.disabled = false; btn.innerText = "PUBLISH AD";
}

// 3. Market Logic: Fetch Real Ads
async function loadAds(type) {
    const container = document.getElementById('ad-list-container');
    container.innerHTML = '<div style="padding:40px; text-align:center; color:#444;">Fetching market...</div>';

    const { data: ads } = await _supabase
        .from('ads')
        .select('*, profiles(username, rating)')
        .eq('type', type)
        .eq('status', 'active');

    if(!ads || ads.length === 0) {
        container.innerHTML = '<div style="padding:40px; text-align:center; color:#444;">No ads available</div>';
        return;
    }

    container.innerHTML = ads.map(ad => `
        <div class="card" onclick="startTrade(${ad.id})">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <div style="font-weight:700;">${ad.profiles.username} <span style="color:#444; font-weight:400;">(${ad.profiles.rating}%)</span></div>
                <div style="color:var(--green); font-weight:800; font-size:18px;">₹${ad.price}</div>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:12px; color:#888;">Limit: ${ad.amount} USDT</div>
                <button style="background:var(--white); border:none; padding:8px 20px; border-radius:8px; font-weight:800; font-size:12px;">${type.toUpperCase()}</button>
            </div>
        </div>
    `).join('');
}

// 4. UI Navigation
function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.innerText.toLowerCase() === id.split('-')[1]);
    });
}

initApp();
</script>
</body>
  </html>
